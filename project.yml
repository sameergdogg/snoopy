name: Snoopy
options:
  bundleIdPrefix: dev.snoopy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SnoopyCore:
    path: Packages/SnoopyCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
targets:
  Snoopy:
    type: application
    platform: macOS
    sources:
      - path: Snoopy
        excludes: ["Info.plist"]
    dependencies:
      - package: SnoopyCore
        product: SnoopyCore
      - package: SnoopyCore
        product: SnoopyIPC
      - package: Sparkle
        product: Sparkle
    info:
      path: Snoopy/Info.plist
      properties:
        CFBundleName: Snoopy
        CFBundleDisplayName: Snoopy
        # Driven by build settings so `release.sh <version>` is the single source of
        # truth. These were hardcoded, and the release script only used its version
        # argument to name the DMG — so `release.sh 0.2.0` produced Snoopy-0.2.0.dmg
        # containing an app that still called itself 0.1.0 build 1.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SnoopyReleaseChannel: "$(SNOOPY_RELEASE_CHANNEL)"

        # Sparkle. The feed is the appcast attached to the newest non-prerelease, and
        # GitHub's /releases/latest/download/<asset> redirect keeps that URL stable.
        SUFeedURL: "https://github.com/sameergdogg/snoopy/releases/latest/download/appcast.xml"
        # Public half of the EdDSA pair; the private half lives only in the login keychain of
        # the release machine. An update that is not signed by it is refused.
        SUPublicEDKey: "RTbdSO7FN4Hlu8jTkod4SvcdB8SsFRN6CqEoxV5jpag="
        # Set explicitly so Sparkle never shows its "check for updates?" permission prompt
        # on first launch — the answer is yes, and the user can change it in the menu.
        SUEnableAutomaticChecks: true
        # Download and stage updates in the background, then apply on quit. This is what
        # makes it an auto-update rather than a prompt: the next launch is simply the new
        # version. "Install and Relaunch" is still offered for anyone who wants it now.
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT License"
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.snoopy.Snoopy
        PRODUCT_NAME: Snoopy
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        # Defaults for local builds. `release.sh` overrides all three; the "-dev" suffix
        # makes a locally built app obvious in an About box or a bug report.
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SNOOPY_RELEASE_CHANNEL: "0.2.0-dev"
    postCompileScripts:
      - name: Build and embed SnoopyHook dylib
        script: |
          "$SRCROOT/Scripts/build-hook.sh" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        # Without inputFiles Xcode sees only the declared output, treats the phase as
        # up to date and silently ships a stale dylib after any hook edit.
        inputFiles:
          - "$(SRCROOT)/Scripts/build-hook.sh"
          - "$(SRCROOT)/Hook/SNPHook.m"
          - "$(SRCROOT)/Hook/SNPCapture.m"
          - "$(SRCROOT)/Hook/SNPCapture.h"
          - "$(SRCROOT)/Hook/SNPTransport.m"
          - "$(SRCROOT)/Hook/SNPTransport.h"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/libSnoopyHook.dylib"
    scheme:
      testTargets: []
